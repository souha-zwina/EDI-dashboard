name: CI

# Déclenché sur chaque push et chaque pull request vers main -> aucun code
# cassé ne peut être fusionné sans que les tests passent d'abord.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Installer les dépendances (prod + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Vérifier la syntaxe (compilation)
        run: python -m py_compile app.py src/*.py src/ui/*.py src/ui/pages/*.py manage_users.py run_watcher.py

      - name: Lancer la suite de tests
        run: pytest --tb=short

  lint:
    name: Analyse statique (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer ruff
        run: pip install ruff==0.6.9

      - name: Lancer ruff
        run: ruff check . --output-format=github

  docker-build:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: edi-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
